namespace: "0015"
name: "map_tiles"
version: "2.0.0"
maintainers:
  - Eric Nam <thatprojectstudio@gmail.com>
description: "Map tiles component for LVGL 9.x - offline map display, smooth-panning map view, route rendering and turn-by-turn navigation"
url: "https://github.com/0015/map_tiles"
license: "MIT"

dependencies:
  lvgl/lvgl: ">=9.3.0"
  idf: ">=5.0"

# dist/, build/, __pycache__ and .DS_Store are excluded by default; these are
# not, and have no business in a published component.
files:
  exclude:
    - ".codex/**/*"
    - "script/__pycache__/**/*"

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2
  - esp32p4

keywords:
  - lvgl
  - map
  - tiles
  - gps
  - graphics
  - ui
  - navigation
  - route
  - offline
